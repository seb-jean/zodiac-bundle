name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: '0 0 1,16 * *'

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php-version }}, SF ${{ matrix.symfony-version }} - ${{ matrix.dependencies }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: [ 8.4, 8.5 ]
        dependencies: [ highest ]
        symfony-version: [ 8.1.*, 8.2.* ]
        include:
          - php-version: 8.4
            dependencies: lowest
            symfony-version: '*'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
          tools: flex

      - name: Install dependencies
        uses: ramsey/composer-install@v4
        with:
          dependency-versions: ${{ matrix.dependencies }}
          composer-options: --prefer-dist
        env:
          SYMFONY_REQUIRE: ${{ matrix.symfony-version }}

      - name: Test
        run: vendor/bin/phpunit ${{ matrix.dependencies == 'lowest' && '--do-not-fail-on-direct-deprecation' || '' }}

  php-stan:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4

      - name: Install dependencies
        uses: ramsey/composer-install@v4

      - name: PHPStan
        run: vendor/bin/phpstan analyse

  php-cs-fixer:
    name: PHP-CS-Fixer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4

      - name: Install dependencies
        uses: ramsey/composer-install@v4

      - name: PHP-CS-Fixer
        run: vendor/bin/php-cs-fixer fix --dry-run --diff
